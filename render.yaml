services:
  # Python Web Service (Backend API)
  - type: web
    name: road-accident-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn webapp.backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11

  # Static Site (React + Vite Frontend)
  - type: static
    name: road-accident-explorer
    rootDir: webapp/frontend
    buildCommand: npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://road-accident-api.onrender.com/api
